services:
  # Backend API Service (Docker)
  - type: web
    name: portfolio-backend
    runtime: docker           # Use Docker build via Dockerfile
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter             # Upgrade to 'standard' for persistent disk support
    region: oregon            # Change to your preferred region
    # Render injects PORT automatically; the app reads process.env.PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false           # Set in Render dashboard
      - key: JWT_SECRET
        sync: false           # Set in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false           # Set after frontend deployment
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: RECAPTCHA_SECRET_KEY
        sync: false           # Set in Render dashboard
      - key: DISABLE_RECAPTCHA
        value: "false"        # Always enforce reCAPTCHA in production
    # Persistent Disk: keeps uploaded files across redeploys and restarts.
    # NOTE: Persistent disks require a paid plan (Standard or above).
    # If on free tier, files will be lost on each deploy — consider Cloudinary instead.
    disk:
      name: portfolio-uploads
      mountPath: /app/public/uploads
      sizeGB: 1               # Increase as needed

  # Frontend Static Site (no Docker needed — Render serves Vite output directly)
  - type: static
    name: portfolio-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false           # Set to your backend URL, e.g. https://portfolio-backend.onrender.com/api
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
      - key: VITE_DISABLE_RECAPTCHA
        value: "false"        # Always enforce reCAPTCHA in production

